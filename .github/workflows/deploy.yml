name: CI/CD Pipeline for CreditBook 

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
          RENDER_DEPLOY_HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          echo "Triggering backend deployment..."
          curl -X POST $RENDER_DEPLOY_HOOK_BACKEND
          
          echo "Waiting 30 seconds before frontend deployment..."
          sleep 30
          
          echo "Triggering frontend deployment..."
          curl -X POST $RENDER_DEPLOY_HOOK_FRONTEND
          
          echo "Deployments triggered successfully!"
